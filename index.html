<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR.js 电子云无标记AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
#tip {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 24px;
  background: rgba(0,0,0,0.7);
  color: white;
  border-radius: 8px;
  font-size: 16px;
  z-index: 1000;
  text-align: center;
}
#startBtn {
  position: fixed;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  padding: 16px 32px;
  background: #007AFF;
  color: white;
  border: none;
  border-radius: 25px;
  font-size: 18px;
  cursor: pointer;
  z-index: 1001;
  transition: background 0.2s;
}
#startBtn:hover {
  background: #0066CC;
}
#startBtn:disabled {
  background: #999;
  cursor: not-allowed;
}
</style>
<script>
// 预加载的点云数据
let cachedPointCloud = null;
// 预加载点云数据的函数
function preloadPointCloud() {
  if (cachedPointCloud) return Promise.resolve(cachedPointCloud);
  return fetch('./pointcloud.json')
    .then(res => res.json())
    .then(points => {
      cachedPointCloud = points;
      return points;
    })
    .catch(err => {
      console.error('预加载点云失败:', err);
      throw err;
    });
}

// 注册点云加载组件，使用预加载好的数据
AFRAME.registerComponent('preloaded-pointcloud', {
  schema: {
    points: { type: 'array' }
  },
  init: function () {
    const el = this.el;
    const points = this.data.points;
    const tip = document.getElementById('tip');
    
    tip.textContent = '正在创建3D模型...';
    
    // 1. 计算点云包围盒，自适应缩放到40cm
    let minX = Infinity, minY = Infinity, minZ = Infinity;
    let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    
    points.forEach((point) => {
      minX = Math.min(minX, point.x);
      minY = Math.min(minY, point.y);
      minZ = Math.min(minZ, point.z);
      maxX = Math.max(maxX, point.x);
      maxY = Math.max(maxY, point.y);
      maxZ = Math.max(maxZ, point.z);
    });
    
    const sizeX = maxX - minX;
    const sizeY = maxY - minY;
    const sizeZ = maxZ - minZ;
    const maxSize = Math.max(sizeX, sizeY, sizeZ);
    const scale = 0.4 / maxSize; // 缩放到最大40cm
    
    // 计算中心
    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;
    const centerZ = (minZ + maxZ) / 2;
    
    // 解析点云
    const vertices = new Float32Array(points.length * 3);
    const colors = new Float32Array(points.length * 3);
    
    points.forEach((point, i) => {
      vertices[i*3] = (point.x - centerX) * scale;
      vertices[i*3+1] = (point.y - centerY) * scale;
      vertices[i*3+2] = (point.z - centerZ) * scale;
      colors[i*3] = point.r / 255;
      colors[i*3+1] = point.g / 255;
      colors[i*3+2] = point.b / 255;
    });
    
    // 创建点云
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    
    // 圆形点纹理
    const canvas = document.createElement('canvas');
    canvas.width = 16;
    canvas.height = 16;
    const ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.arc(8, 8, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    const pointTexture = new THREE.CanvasTexture(canvas);
    
    const material = new THREE.PointsMaterial({
      size: 0.01, // 放大点的大小，确保能看到
      vertexColors: true,
      sizeAttenuation: true,
      map: pointTexture,
      transparent: true
    });
    
    const pointCloud = new THREE.Points(geometry, material);
    el.object3D.add(pointCloud);
    
    // 2. 创建坐标轴，总长度60cm
    const axisLen = 0.3; // 半长，总长度60cm
    const step = axisLen / 10;
    
    const sphereGeo = new THREE.SphereGeometry(0.005, 4, 4);
    const sphereMat = new THREE.MeshBasicMaterial({color: 0xffffff});
    
    // X轴红
    const xGeo = new THREE.BufferGeometry();
    xGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-axisLen, 0, 0, axisLen, 0, 0]), 3));
    const xLine = new THREE.Line(xGeo, new THREE.LineBasicMaterial({color: 0xff0000, linewidth: 10}));
    el.object3D.add(xLine);
    for (let i = -axisLen + step; i <= axisLen; i += step) {
      const s = new THREE.Mesh(sphereGeo, sphereMat);
      s.position.set(i, 0, 0);
      el.object3D.add(s);
    }
    const xArrow = new THREE.ArrowHelper(new THREE.Vector3(-1,0,0), new THREE.Vector3(-axisLen,0,0), 1.8*step, 0xffffff, 0.45*step, 0.225*step);
    el.object3D.add(xArrow);
    
    // Y轴绿
    const yGeo = new THREE.BufferGeometry();
    yGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, -axisLen, 0, 0, axisLen, 0]), 3));
    const yLine = new THREE.Line(yGeo, new THREE.LineBasicMaterial({color: 0x00ff00, linewidth: 10}));
    el.object3D.add(yLine);
    for (let i = -axisLen + step; i <= axisLen; i += step) {
      const s = new THREE.Mesh(sphereGeo, sphereMat);
      s.position.set(0, i, 0);
      el.object3D.add(s);
    }
    const yArrow = new THREE.ArrowHelper(new THREE.Vector3(0,-1,0), new THREE.Vector3(0,-axisLen,0), 1.8*step, 0xffffff, 0.45*step, 0.225*step);
    el.object3D.add(yArrow);
    
    // Z轴蓝，正方向朝上
    const zGeo = new THREE.BufferGeometry();
    zGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, -axisLen, 0, 0, axisLen]), 3));
    const zLine = new THREE.Line(zGeo, new THREE.LineBasicMaterial({color: 0x0000ff, linewidth: 10}));
    el.object3D.add(zLine);
    for (let i = -axisLen + step; i <= axisLen; i += step) {
      const s = new THREE.Mesh(sphereGeo, sphereMat);
      s.position.set(0, 0, i);
      el.object3D.add(s);
    }
    const zArrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,-1), new THREE.Vector3(0,0,-axisLen), 1.8*step, 0xffffff, 0.45*step, 0.225*step);
    el.object3D.add(zArrow);
    
    // 坐标系调整，Z轴朝上
    el.object3D.rotation.x = -Math.PI / 2;
    // Z轴最底端离平面5cm
    el.object3D.position.y += axisLen + 0.05;
    
    // 模型加载完成，显示出来
    el.object3D.visible = true;
    tip.textContent = '模型已显示，单指拖动移动，双指捏合缩放';
    
    // 3. 触摸控制：单指移动，双指缩放
    let initialTouches = null;
    let initialScale = 1;
    let initialPosition = el.object3D.position.clone();
    
    el.sceneEl.addEventListener('touchstart', (e) => {
      if (!el.object3D.visible) return;
      e.preventDefault();
      initialTouches = e.touches;
      initialScale = el.object3D.scale.x;
      initialPosition = el.object3D.position.clone();
    });
    
    el.sceneEl.addEventListener('touchmove', (e) => {
      if (!el.object3D.visible) return;
      e.preventDefault();
      if (!initialTouches) return;
      
      if (e.touches.length === 1) {
        // 单指移动
        const dx = e.touches[0].clientX - initialTouches[0].clientX;
        const dy = e.touches[0].clientY - initialTouches[0].clientY;
        el.object3D.position.x = initialPosition.x + dx * 0.001;
        el.object3D.position.z = initialPosition.z + dy * 0.001;
      } else if (e.touches.length === 2) {
        // 双指缩放
        const dx1 = e.touches[0].clientX - e.touches[1].clientX;
        const dy1 = e.touches[0].clientY - e.touches[1].clientY;
        const currentDist = Math.sqrt(dx1*dx1 + dy1*dy1);
        
        const dx2 = initialTouches[0].clientX - initialTouches[1].clientX;
        const dy2 = initialTouches[0].clientY - initialTouches[1].clientY;
        const initialDist = Math.sqrt(dx2*dx2 + dy2*dy2);
        
        const newScale = initialScale * (currentDist / initialDist);
        el.object3D.scale.set(newScale, newScale, newScale);
      }
    });
    
    el.sceneEl.addEventListener('touchend', () => {
      initialTouches = null;
    });
    
    // 自动旋转
    el.sceneEl.addEventListener('tick', (e) => {
      if (!el.object3D.visible) return;
      const deltaTime = e.detail.delta;
      const seconds = deltaTime / 1000;
      el.object3D.rotation.z -= seconds * (2 * Math.PI / 30);
    });
  }
});

// 放置模型的函数
function placeModel(sceneEl) {
  // 只处理一次点击
  sceneEl.removeEventListener('click', placeModelHandler);
  
  let position;
  // 尝试获取平面点击的交点（仅部分支持WebXR的浏览器可用）
  const intersection = window.lastIntersection;
  if (intersection && intersection.point) {
    position = intersection.point;
  } else {
    // 不支持平面检测的设备，默认放在相机前方0.5米处，兼容原逻辑
    position = { x: 0, y: 0, z: -0.5 };
  }
  
  // 创建模型实体，使用预加载好的点云数据，秒加载
  const entity = document.createElement('a-entity');
  entity.setAttribute('position', {
    x: position.x,
    y: position.y,
    z: position.z
  });
  entity.setAttribute('visible', false);
  entity.setAttribute('preloaded-pointcloud', { points: cachedPointCloud });
  sceneEl.appendChild(entity);
}

function placeModelHandler(e) {
  // 保存点击的交点
  window.lastIntersection = e.detail.intersection;
  placeModel(document.querySelector('a-scene'));
}

// 页面加载完成后初始化
window.addEventListener('load', () => {
  const tip = document.getElementById('tip');
  const startBtn = document.getElementById('startBtn');
  
  // 开始按钮点击事件
  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    try {
      // 1. 点击后立刻预加载点云数据，后台提前加载，不阻塞流程
      preloadPointCloud();
      
      tip.textContent = '正在请求权限，请依次允许相机和运动传感器权限...';
      
      // 2. 并行发起两个权限请求，都在用户手势的同步上下文内，避免浏览器报错
      // 先发起相机权限请求
      const cameraPromise = navigator.mediaDevices.getUserMedia({ video: true });
      
      // 同步发起运动权限请求，两个请求都在用户点击的同步上下文中
      let motionPromise = Promise.resolve();
      let hasMotionPermission = true;
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        motionPromise = DeviceMotionEvent.requestPermission().then(permission => {
          hasMotionPermission = permission === 'granted';
        });
      }
      
      // 等待两个权限请求都完成
      await Promise.all([cameraPromise, motionPromise]);
      
      // 检查运动权限是否通过
      if (!hasMotionPermission) {
        tip.textContent = '运动权限被拒绝，无法使用AR功能';
        startBtn.disabled = false;
        return;
      }
      
      // 3. 权限都获取完成，现在初始化AR场景，此时权限已经都有了，AR不会再重复请求权限
      const sceneEl = document.querySelector('a-scene');
      sceneEl.style.display = 'block';
      
      // 4. 监听相机初始化完成事件
      sceneEl.addEventListener('camera-init', () => {
        // 相机初始化完成，提示用户扫描环境
        tip.textContent = '请移动手机扫描环境，完成AR平面初始化...';
        
        // 给用户3秒时间扫描环境，初始化AR追踪
        setTimeout(() => {
          tip.textContent = '环境初始化完成，点击屏幕放置模型';
          // 扫描完成，监听点击放置模型
          sceneEl.addEventListener('click', placeModelHandler);
        }, 3000);
      });
      
    } catch (err) {
      tip.textContent = '权限请求失败：' + err.message;
      startBtn.disabled = false;
      console.error(err);
    }
  });
});
</script>
</head>
<body style="margin: 0; overflow: hidden;">
<div id="tip">点击下方按钮开始AR体验</div>
<button id="startBtn">开始AR体验</button>
<a-scene embedded style="display: none;" arjs="
  sourceType: webcam;
  detectionMode: none;
  deviceOrientation: true;
">
  <a-entity camera look-controls></a-entity>
</a-scene>
</body>
</html>
