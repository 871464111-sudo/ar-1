
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>平面AR - 点云模型地面放置观察</title>
  <!-- 引入支持WebXR平面检测的A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    a-scene {
      width: 100%;
      height: 100%;
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 20px 30px;
      border-radius: 10px;
      text-align: center;
      z-index: 9999;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <!-- 开启WebXR的hit-test和平面检测功能 -->
  <a-scene 
    vr-mode-ui="enabled: false"
    webxr="requiredFeatures: hit-test,local-floor; optionalFeatures: plane-detection;"
    renderer="antialias: true; alpha: true"
  >
    <!-- 光照系统 -->
    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" position="5 10 7.5" intensity="0.6" castShadow></a-light>
    
    <a-camera></a-camera>
  </a-scene>

  <!-- 加载状态提示 -->
  <div id="loading" class="loading">
    正在初始化AR...<br>
    请允许相机权限
  </div>

  <script>
    window.onload = async () => {
      const loadingEl = document.getElementById('loading');
      const THREE = window.THREE;
      let pointCloud = null;
      let isPlaced = false;

      try {
        // 1. 先加载同目录下的pointcloud.json
        loadingEl.innerHTML = '正在加载点云模型...';
        const res = await fetch('./pointcloud.json');
        if(!res.ok) throw new Error('找不到pointcloud.json，请确认它和HTML在同一个文件夹');
        const points = await res.json();
        console.log('成功加载点云，共', points.length, '个点');

        // 2. 处理点云：自动居中、缩放
        let minX = Infinity, minY = Infinity, minZ = Infinity;
        let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
        for (const p of points) {
          minX = Math.min(minX, p.x);
          minY = Math.min(minY, p.y);
          minZ = Math.min(minZ, p.z);
          maxX = Math.max(maxX, p.x);
          maxY = Math.max(maxY, p.y);
          maxZ = Math.max(maxZ, p.z);
        }
        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        const centerZ = (minZ + maxZ) / 2;
        // 自动缩放到4米大小，适合围绕观察
        const rawMaxSize = Math.max(maxX - minX, maxY - minY, maxZ - minZ);
        const scaleFactor = 4 / rawMaxSize;

        // 3. 构建Three.js顶点数据
        const positions = new Float32Array(points.length * 3);
        const colors = new Float32Array(points.length * 3);
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          positions[i*3]     = (p.x - centerX) * scaleFactor;
          positions[i*3 + 1] = (p.y - centerY) * scaleFactor;
          positions[i*3 + 2] = (p.z - centerZ) * scaleFactor;
          colors[i*3]       = p.r / 255;
          colors[i*3 + 1]   = p.g / 255;
          colors[i*3 + 2]   = p.b / 255;
        }

        // 4. 创建点云对象
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const material = new THREE.PointsMaterial({
          size: 0.05,
          sizeAttenuation: true,
          vertexColors: true,
          transparent: true,
          opacity: 0.8
        });
        pointCloud = new THREE.Points(geometry, material);
        // 初始位置，放在相机前方
        pointCloud.position.set(0, 0, -1);

        // 5. 添加到场景
        const entity = document.createElement('a-entity');
        entity.setObject3D('mesh', pointCloud);
        document.querySelector('a-scene').appendChild(entity);

        loadingEl.innerHTML = '正在扫描地面...\n请移动手机，对准你要放置模型的地面';

        // 6. 监听WebXR的Hit-Test，自动检测地面平面
        const sceneEl = document.querySelector('a-scene');
        sceneEl.addEventListener('tick', () => {
          if(isPlaced || !pointCloud) return;

          // 获取当前的XR会话
          const xrSession = navigator.xr?.getSession?.('immersive-ar');
          if(!xrSession) return;

          // 获取Hit-Test的结果
          const frame = xrSession.getFrame?.();
          if(!frame) return;

          // 对屏幕中心做Hit-Test，检测地面
          const hitTestResults = frame.getHitTestResultsForTransientInput?.(
            xrSession.hitTestSources?.[0], 
            new DOMPoint(0.5, 0.5)
          );

          if(hitTestResults && hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose?.(xrSession.renderState.baseLayer.transform);
            if(pose) {
              // 找到地面了，把点云放在这个平面上
              pointCloud.position.set(
                pose.transform.position.x,
                pose.transform.position.y,
                pose.transform.position.z
              );
              isPlaced = true;
              loadingEl.style.display = 'none';
              alert('✅ 点云已成功放置在地面上！\n你可以拿着手机移动，360°围绕观察这个模型了！');
            }
          }
        });

      } catch (err) {
        console.error('错误:', err);
        loadingEl.innerHTML = `错误: ${err.message}`;
      }
    };
  </script>
</body>
</html>
